amcl:
  ros__parameters:
    use_sim_time: true

map_server:
  ros__parameters:
    use_sim_time: true

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins:
      - DynNav
    DynNav:
      plugin: "dynnav_nav2_cpp::DynNavGlobalPlanner"
      allow_unknown: true
      lethal_cost_threshold: 253
      neutral_cost: 1.0
      risk_weight: 4.0
      irreversibility_weight: 4.0
      unknown_risk: 0.5
      max_iterations: 0

controller_server:
  ros__parameters:
    use_sim_time: true

bt_navigator:
  ros__parameters:
    use_sim_time: true

behavior_server:
  ros__parameters:
    use_sim_time: true
