# DynNav Nav2 configuration for ROS 2 Jazzy
# TurtleBot3 + Gazebo Harmonic integration

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins:
      - DynNav

    DynNav:
      plugin: dynnav_nav2_cpp/DynNavPlanner
      tolerance: 0.5

controller_server:
  ros__parameters:
    controller_plugins:
      - FollowPath

bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: navigate_to_pose_w_replanning_and_recovery.xml

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
