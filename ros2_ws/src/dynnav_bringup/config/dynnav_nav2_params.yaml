planner_server:
  ros__parameters:
    planner_plugins:
      - DynNav

    DynNav:
      plugin: "dynnav_nav2_cpp::DynNavGlobalPlanner"
      allow_unknown: true
      lethal_cost_threshold: 253
      neutral_cost: 1.0
      risk_weight: 4.0
      irreversibility_weight: 4.0
      unknown_risk: 0.5
      max_iterations: 0

controller_server:
  ros__parameters:
    controller_plugins:
      - FollowPath
