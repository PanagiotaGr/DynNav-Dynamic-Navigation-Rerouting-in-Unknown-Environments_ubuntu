<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" rx="32" fill="#0b1220"/><text x="70" y="70" fill="#f8fafc" font-family="Arial" font-size="34" font-weight="700">Why DynNav exists</text><text x="70" y="108" fill="#94a3b8" font-family="Arial" font-size="18">A short path can be brittle if it consumes the robot's remaining escape options.</text><g font-family="Arial"><rect x="70" y="160" width="580" height="500" rx="26" fill="#111827" stroke="#334155"/><text x="105" y="210" fill="#f8fafc" font-size="26" font-weight="700">Conventional choice</text><text x="105" y="245" fill="#94a3b8" font-size="17">Prefer the shorter route.</text><rect x="120" y="300" width="450" height="80" rx="12" fill="#1f2937"/><rect x="120" y="470" width="450" height="80" rx="12" fill="#1f2937"/><rect x="250" y="380" width="190" height="90" fill="#374151"/><circle cx="160" cy="340" r="20" fill="#34d399"/><circle cx="530" cy="510" r="20" fill="#a78bfa"/><path d="M160 340 C250 345 290 405 345 425 S455 475 530 510" fill="none" stroke="#f59e0b" stroke-width="9"/><rect x="330" y="395" width="55" height="60" rx="8" fill="#ef4444"/><text x="305" y="585" fill="#fecaca" font-size="17" font-weight="700">Obstacle appears after commitment</text><text x="303" y="612" fill="#94a3b8" font-size="15">few practical retreat options remain</text><rect x="750" y="160" width="580" height="500" rx="26" fill="#111827" stroke="#334155"/><text x="785" y="210" fill="#f8fafc" font-size="26" font-weight="700">DynNav question</text><text x="785" y="245" fill="#94a3b8" font-size="17">Also value states that preserve alternatives.</text><rect x="800" y="300" width="450" height="80" rx="12" fill="#1f2937"/><rect x="800" y="470" width="450" height="80" rx="12" fill="#1f2937"/><rect x="930" y="380" width="190" height="90" fill="#374151"/><circle cx="840" cy="340" r="20" fill="#34d399"/><circle cx="1210" cy="510" r="20" fill="#a78bfa"/><path d="M840 340 C900 315 960 290 1025 300 S1130 400 1210 510" fill="none" stroke="#22d3ee" stroke-width="9"/><path d="M925 325 C900 390 865 430 820 475" fill="none" stroke="#34d399" stroke-width="6" stroke-dasharray="12 10"/><path d="M1030 305 C1080 285 1135 280 1190 300" fill="none" stroke="#34d399" stroke-width="6" stroke-dasharray="12 10"/><text x="860" y="585" fill="#a7f3d0" font-size="17" font-weight="700">Alternative directions remain available</text><text x="894" y="612" fill="#94a3b8" font-size="15">the route may be slightly longer</text><text x="160" y="330" fill="#052e16" font-size="11" font-weight="700">S</text><text x="1203" y="515" fill="#2e1065" font-size="11" font-weight="700">G</text></g><text x="700" y="720" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="14">Conceptual explanatory figure — not experimental evidence</text></svg>