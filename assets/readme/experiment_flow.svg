<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520"><rect width="1500" height="520" rx="32" fill="#0b1220"/><text x="70" y="65" fill="#f8fafc" font-family="Arial" font-size="34" font-weight="700">How a DynNav experiment works</text><text x="70" y="102" fill="#94a3b8" font-family="Arial" font-size="18">The research question is tested across the full dynamic loop, not only on the first path.</text><g font-family="Arial" font-size="16" font-weight="700"><g fill="#0f766e"><rect x="55" y="185" width="160" height="95" rx="18"/><rect x="245" y="185" width="160" height="95" rx="18"/></g><g fill="#1d4ed8"><rect x="435" y="185" width="160" height="95" rx="18"/><rect x="625" y="185" width="160" height="95" rx="18"/></g><g fill="#b45309"><rect x="815" y="185" width="160" height="95" rx="18"/><rect x="1005" y="185" width="160" height="95" rx="18"/></g><g fill="#7c3aed"><rect x="1195" y="185" width="250" height="95" rx="18"/></g><g fill="#f8fafc" text-anchor="middle"><text x="135" y="225">Load scenario</text><text x="135" y="250">start + goal</text><text x="325" y="225">Observe map</text><text x="325" y="250">risk + uncertainty</text><text x="515" y="225">Plan</text><text x="515" y="250">J0 / J1 / J2 / J3</text><text x="705" y="225">Execute</text><text x="705" y="250">robot route</text><text x="895" y="225">Change world</text><text x="895" y="250">invalidate route</text><text x="1085" y="225">Replan</text><text x="1085" y="250">after observation</text><text x="1320" y="225">Measure + retain evidence</text><text x="1320" y="250">success · failure · latency · risk</text></g><g stroke="#64748b" stroke-width="5" fill="none"><path d="M215 232h30"/><path d="M405 232h30"/><path d="M595 232h30"/><path d="M785 232h30"/><path d="M975 232h30"/><path d="M1165 232h30"/></g><g fill="#64748b"><path d="M240 223l14 9-14 9z"/><path d="M430 223l14 9-14 9z"/><path d="M620 223l14 9-14 9z"/><path d="M810 223l14 9-14 9z"/><path d="M1000 223l14 9-14 9z"/><path d="M1190 223l14 9-14 9z"/></g><path d="M1320 300 C1320 400 700 430 705 285" fill="none" stroke="#22d3ee" stroke-width="4" stroke-dasharray="12 10"/><text x="1010" y="410" fill="#67e8f9" font-family="Arial" font-size="16" font-weight="700">repeat across matched scenarios, seeds and planner objectives</text></g><text x="750" y="485" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="14">Conceptual workflow — quantitative conclusions come from retained experiment artifacts</text></svg>