schema_version: 1
suite: DynNav C01-C26 executable experiment suite
evidence_policy: >-
  Every registered command is a deterministic smoke or controlled synthetic
  benchmark. A passing command is implementation evidence, not a real-robot,
  Gazebo, formal-proof, trained-model, or generalization claim.
experiments:
  - contribution_id: C01
    experiment_id: c01_learned_astar_comparison
    hypothesis: A learned heuristic can reduce A* node expansions without materially reducing success or increasing path length relative to classical A*.
    runner: contributions/01_learned_astar/experiments/eval_astar_learned.py
    smoke_arguments: ["--trials", "8", "--min-goal-distance", "8"]
    output_argument: --out
    artifact: c01_learned_astar.csv
    optional_dependencies: [torch]
    baselines: [Classical A*]
    primary_metrics: [classic_success, learned_success, classic_expansions, learned_expansions, expansion_ratio, delta_path, runtime_ratio]
    evidence_level: synthetic
    limitation: Requires the repository's local trained checkpoint and PyTorch; synthetic grids do not establish transfer to Nav2 or a physical robot.

  - contribution_id: C02
    experiment_id: c02_uncertainty_calibration
    hypothesis: Post-hoc calibration improves absolute-error calibration and empirical interval coverage relative to raw uncertainty estimates.
    runner: contributions/02_uncertainty_calibration/experiments/eval_uncertainty_calibration.py
    smoke_arguments: ["--n", "200", "--seed", "13"]
    output_argument: --out
    artifact: c02_uncertainty_calibration.csv
    optional_dependencies: []
    baselines: [Raw uncertainty, Affine calibration]
    primary_metrics: [ece_abs_error, coverage_1sigma, coverage_2sigma, pearson_uncertainty_error, spearman_uncertainty_error]
    evidence_level: synthetic
    limitation: The default generator is synthetic and cannot establish calibration under sensor drift or domain shift.

  - contribution_id: C03
    experiment_id: c03_belief_risk_tradeoff
    hypothesis: CVaR-aware route selection reduces tail occupancy risk with a measurable path-length trade-off relative to risk-neutral routing.
    runner: contributions/03_belief_risk_planning/experiments/eval_risk_tradeoff.py
    smoke_arguments: ["--alpha", "0.95", "--objective-risk", "cvar"]
    output_argument: --out
    artifact: c03_belief_risk_tradeoff.csv
    optional_dependencies: []
    baselines: [Risk-neutral route, Expected-risk route]
    primary_metrics: [path_length, expected_risk, cvar_risk, max_risk, total_objective, dominated]
    evidence_level: synthetic
    limitation: Route candidates and beliefs are controlled fixtures rather than live occupancy estimates.

  - contribution_id: C04
    experiment_id: c04_recoverability_profile
    hypothesis: Recoverability loss and bottleneck exposure distinguish fragile paths that conventional path length alone treats as acceptable.
    runner: contributions/04_irreversibility_returnability/experiments/eval_recoverability_metrics.py
    smoke_arguments: []
    output_argument: --out
    artifact: c04_recoverability_profile.csv
    optional_dependencies: []
    baselines: [Geometric path length]
    primary_metrics: [min_recoverability, cumulative_recoverability_loss, bottleneck_exposure, max_irreversibility, all_returnable]
    evidence_level: synthetic
    limitation: Recoverability is evaluated on discrete graph fixtures and is not yet a calibrated real-world failure probability.

  - contribution_id: C05
    experiment_id: c05_safe_mode_thresholds
    hypothesis: Hysteresis and persistence thresholds reduce mode chattering while escalating high-risk traces to safe mode or emergency stop.
    runner: contributions/05_safe_mode_navigation/experiments/eval_safe_mode_thresholds.py
    smoke_arguments: ["--n-steps", "20"]
    output_argument: --out
    artifact: c05_safe_mode_thresholds.csv
    optional_dependencies: []
    baselines: [Single-threshold supervisor]
    primary_metrics: [safe_mode_steps, emergency_stop_steps, transitions, replans, operator_alerts, mean_commanded_speed]
    evidence_level: synthetic
    limitation: Controller outputs are policy decisions on scripted traces, not closed-loop velocity validation.

  - contribution_id: C06
    experiment_id: c06_resource_feasibility
    hypothesis: Explicit energy reserve and connectivity constraints reject mission routes that distance-only planning would incorrectly accept.
    runner: contributions/06_energy_connectivity/experiments/eval_resource_feasibility.py
    smoke_arguments: ["--battery-budget", "26", "--reserve-energy", "2", "--min-connectivity", "0.35"]
    output_argument: --out
    artifact: c06_resource_feasibility.csv
    optional_dependencies: []
    baselines: [Distance-only feasibility]
    primary_metrics: [energy_margin, connectivity_margin, feasible, selected_best, via_recharge, via_relay]
    evidence_level: synthetic
    limitation: Energy and radio models are analytical proxies without hardware characterization.

  - contribution_id: C07
    experiment_id: c07_returnability_aware_nbv
    hypothesis: Returnability-aware next-best-view scoring preserves safer retreat options than information-gain-only selection.
    runner: contributions/07_next_best_view/experiments/eval_returnability_aware_nbv.py
    smoke_arguments: ["--risk-weight", "1.0", "--returnability-weight", "1.0", "--connectivity-weight", "0.25"]
    output_argument: --out
    artifact: c07_returnability_aware_nbv.csv
    optional_dependencies: []
    baselines: [Information-gain-only NBV]
    primary_metrics: [information_gain, path_risk, returnability, connectivity, classic_score, safe_score]
    evidence_level: synthetic
    limitation: Candidate views are hand-authored fixtures rather than sensor-derived frontiers.

  - contribution_id: C08
    experiment_id: c08_ids_response_policy
    hypothesis: Severity- and trust-conditioned IDS response produces graded mitigations rather than a brittle binary alarm policy.
    runner: contributions/08_security_ids/experiments/eval_ids_response_policy.py
    smoke_arguments: []
    output_argument: --out
    artifact: c08_ids_response_policy.csv
    optional_dependencies: []
    baselines: [Binary alarm-only response]
    primary_metrics: [flag_rate, triggered, severity, mitigation, trust_score, d2_ratio]
    evidence_level: synthetic
    limitation: Synthetic detector scores do not demonstrate detection performance against real ROS 2 attacks.

  - contribution_id: C09
    experiment_id: c09_team_coordination
    hypothesis: Joint conflict and risk-budget accounting identifies unsafe multi-robot plans missed by independent single-robot validation.
    runner: contributions/09_multi_robot/experiments/eval_team_coordination.py
    smoke_arguments: []
    output_argument: --out
    artifact: c09_team_coordination.csv
    optional_dependencies: []
    baselines: [Independent robot plans]
    primary_metrics: [n_conflicts, vertex_conflicts, edge_swap_conflicts, risk_budget_violations, belief_disagreement_count, feasible]
    evidence_level: synthetic
    limitation: The benchmark audits predefined plans and does not exercise distributed ROS 2 communication.

  - contribution_id: C10
    experiment_id: c10_human_ethics_policy
    hypothesis: Human distance, operator trust, zone semantics, and instruction confidence should produce auditable speed and autonomy restrictions.
    runner: contributions/10_human_language_ethics/experiments/eval_human_ethics_policy.py
    smoke_arguments: []
    output_argument: --out
    artifact: c10_human_ethics_policy.csv
    optional_dependencies: []
    baselines: [Context-free navigation policy]
    primary_metrics: [action, max_speed, autonomy_level, path_allowed, requires_operator_confirmation, ethical_cost_multiplier]
    evidence_level: synthetic
    limitation: Policy fixtures do not constitute human-subject validation or normative proof.

  - contribution_id: C11
    experiment_id: c11_vlm_goal_validation
    hypothesis: A deterministic safety validator rejects low-confidence, malformed, or out-of-bounds VLM goals before metric planning.
    runner: contributions/11_vlm_navigation_agent/experiments/eval_vlm_goal_validation.py
    smoke_arguments: []
    output_argument: --out
    artifact: c11_vlm_goal_validation.csv
    optional_dependencies: []
    baselines: [Unvalidated VLM output]
    primary_metrics: [decision, valid_confidence, valid_region, valid_pixel, valid_waypoint, reason]
    evidence_level: synthetic
    limitation: This validates structured outputs only; it does not call or benchmark a real vision-language model.

  - contribution_id: C12
    experiment_id: c12_risk_map_quality
    hypothesis: Probabilistic occupancy forecasts improve calibration and high-risk recall relative to deterministic persistence baselines.
    runner: contributions/12_diffusion_occupancy/experiments/eval_risk_map_quality.py
    smoke_arguments: ["--n-scenarios", "4"]
    output_argument: --out
    artifact: c12_risk_map_quality.csv
    optional_dependencies: []
    baselines: [Deterministic persistence, Frequency forecast]
    primary_metrics: [brier_score, nll, high_risk_precision, high_risk_recall, cvar_conservatism_gap]
    evidence_level: synthetic
    limitation: The lightweight predictor is a controlled proxy and not evidence for a trained diffusion model.

  - contribution_id: C13
    experiment_id: c13_rollout_audit
    hypothesis: Latent rollout auditing selects action sequences that balance predicted return with effort and recoverability penalties.
    runner: contributions/13_latent_world_model/experiments/eval_rollout_audit.py
    smoke_arguments: ["--horizon", "6"]
    output_argument: --out
    artifact: c13_rollout_audit.csv
    optional_dependencies: []
    baselines: [Return-only rollout ranking]
    primary_metrics: [imagined_return, action_effort, terminal_latent_norm, recoverability_proxy, irreversible, final_score]
    evidence_level: synthetic
    limitation: The latent dynamics are untrained fixtures and cannot support world-model accuracy claims.

  - contribution_id: C14
    experiment_id: c14_root_cause_attribution
    hypothesis: Counterfactual intervention ranking recovers the injected navigation failure cause more reliably than outcome magnitude alone.
    runner: contributions/14_causal_risk_attribution/experiments/eval_root_cause_attribution.py
    smoke_arguments: ["--n-samples", "30"]
    output_argument: --out
    artifact: c14_root_cause_attribution.csv
    optional_dependencies: []
    baselines: [Outcome-magnitude ranking]
    primary_metrics: [top1_correct, true_cause_rank, counterfactual_reduction, predicted_root_cause]
    evidence_level: synthetic
    limitation: Correctness is relative to a hand-specified structural causal model.

  - contribution_id: C15
    experiment_id: c15_neuromorphic_latency
    hypothesis: Event-stream obstacle detection can reduce detection latency for moving targets while maintaining low false-negative rates relative to frame sampling.
    runner: contributions/15_neuromorphic_sensing/experiments/eval_neuromorphic_latency.py
    smoke_arguments: []
    output_argument: --out
    artifact: c15_neuromorphic_latency.csv
    optional_dependencies: []
    baselines: [Frame-based detector]
    primary_metrics: [detected, detection_time_us, latency_us, false_negative, event_rate_per_ms]
    evidence_level: synthetic
    limitation: Simulated events and Python timing do not establish hardware event-camera latency.

  - contribution_id: C16
    experiment_id: c16_federated_tradeoffs
    hypothesis: Robust or privacy-aware aggregation exposes measurable accuracy, fairness, privacy, and communication trade-offs across robot clients.
    runner: contributions/16_federated_nav_learning/experiments/eval_federated_tradeoffs.py
    smoke_arguments: ["--rounds", "3", "--n-clients", "4"]
    output_argument: --out
    artifact: c16_federated_tradeoffs.csv
    optional_dependencies: []
    baselines: [Centralized reference, FedAvg]
    primary_metrics: [mean_client_mse, worst_client_mse, fairness_gap, communication_floats, final_server_val_mse]
    evidence_level: synthetic
    limitation: Synthetic client objectives do not establish performance on heterogeneous robot datasets.

  - contribution_id: C17
    experiment_id: c17_topological_semantic_navigation
    hypothesis: Sparse semantic grounding and edge invalidation support correct goal retrieval and route adaptation on a topological map.
    runner: contributions/17_topological_semantic_maps/experiments/eval_topo_semantic_navigation.py
    smoke_arguments: []
    output_argument: --out
    artifact: c17_topological_semantic_navigation.csv
    optional_dependencies: []
    baselines: [Nominal topological route]
    primary_metrics: [top1_correct, topk_correct, path_found, path_cost, blocked_edges]
    evidence_level: synthetic
    limitation: Hash-based label embeddings are deterministic stubs, not open-vocabulary perception evidence.

  - contribution_id: C18
    experiment_id: c18_shield_stress_test
    hypothesis: Runtime shielding reduces safety violations and minimum-distance breaches relative to unshielded control under matched scenarios.
    runner: contributions/18_formal_safety_shields/experiments/eval_shield_stress_test.py
    smoke_arguments: []
    output_argument: --out
    artifact: c18_shield_stress_test.csv
    optional_dependencies: []
    baselines: [Unshielded controller]
    primary_metrics: [safety_violations, min_obstacle_distance, min_stl_robustness, intervention_rate, final_goal_distance]
    evidence_level: synthetic
    limitation: Numerical stress tests are not a formal proof and do not cover full robot dynamics.

  - contribution_id: C19
    experiment_id: c19_mission_plan_quality
    hypothesis: Schema-constrained mission planning improves waypoint order, constraint satisfaction, and execution readiness over unchecked language output.
    runner: contributions/19_llm_mission_planner/experiments/eval_mission_plan_quality.py
    smoke_arguments: []
    output_argument: --out
    artifact: c19_mission_plan_quality.csv
    optional_dependencies: []
    baselines: [Unchecked mission sequence]
    primary_metrics: [ordering_accuracy, exact_sequence_match, unresolved_waypoints, forbidden_violations, execution_ready]
    evidence_level: synthetic
    limitation: The benchmark uses deterministic fixtures and does not establish LLM reliability.

  - contribution_id: C20
    experiment_id: c20_failure_report_quality
    hypothesis: Structured multimodal failure reports increase root-cause coverage and operator-action relevance over minimal event summaries.
    runner: contributions/20_multimodal_failure_explainer/experiments/eval_failure_report_quality.py
    smoke_arguments: []
    output_argument: --out
    artifact: c20_failure_report_quality.csv
    optional_dependencies: []
    baselines: [Minimal event summary]
    primary_metrics: [completeness_score, root_cause_recall, action_relevance, stl_coverage, operator_readiness, total_score]
    evidence_level: synthetic
    limitation: Automated rubric scores are not a substitute for blinded operator studies.

  - contribution_id: C21
    experiment_id: c21_policy_safety
    hypothesis: Policy-level safety evaluation reveals reward-safety trade-offs that aggregate return alone would conceal.
    runner: contributions/21_ppo_navigation_agent/experiments/eval_policy_safety.py
    smoke_arguments: ["--episodes", "8"]
    output_argument: --out
    artifact: c21_policy_safety.csv
    optional_dependencies: []
    baselines: [Unshielded policy, Heuristic policy]
    primary_metrics: [success_rate, collision_rate, mean_reward, mean_min_obstacle_distance, shield_intervention_rate]
    evidence_level: synthetic
    limitation: The policies and environment are lightweight fixtures, not trained PPO deployment evidence.

  - contribution_id: C22
    experiment_id: c22_curriculum_strategies
    hypothesis: Adaptive curriculum schedules reach hard scenarios with better stability and sample efficiency than fixed difficulty schedules.
    runner: contributions/22_curriculum_rl/experiments/eval_curriculum_strategies.py
    smoke_arguments: ["--episodes", "40"]
    output_argument: --out
    artifact: c22_curriculum_strategies.csv
    optional_dependencies: []
    baselines: [Fixed curriculum, Linear curriculum]
    primary_metrics: [episodes_to_hard, success_trend, stability_score, heldout_transfer_success, sample_efficiency_score]
    evidence_level: synthetic
    limitation: Synthetic learning curves do not demonstrate sample efficiency for a trained navigation agent.

  - contribution_id: C23
    experiment_id: c23_gaussian_mapping_quality
    hypothesis: Incremental Gaussian-map proxies expose occupancy quality, uncertainty separation, and frontier utility as observations accumulate.
    runner: contributions/23_gaussian_splatting_mapper/experiments/eval_gs_mapping_quality.py
    smoke_arguments: ["--frames", "4"]
    output_argument: --out
    artifact: c23_gaussian_mapping_quality.csv
    optional_dependencies: []
    baselines: [Sparse occupancy proxy]
    primary_metrics: [occupancy_iou, occupancy_precision, occupancy_recall, uncertainty_unknown_gap, frontier_precision_proxy]
    evidence_level: synthetic
    limitation: This is a 2D Gaussian proxy, not photorealistic 3D Gaussian Splatting reconstruction.

  - contribution_id: C24
    experiment_id: c24_nerf_uncertainty
    hypothesis: Rendering-uncertainty proxies separate novel views from known space and improve risk-aware exploration decisions.
    runner: contributions/24_nerf_uncertainty/experiments/eval_nerf_uncertainty.py
    smoke_arguments: []
    output_argument: --out
    artifact: c24_nerf_uncertainty.csv
    optional_dependencies: []
    baselines: [Uniform uncertainty, Uncertainty-agnostic planning]
    primary_metrics: [brier_score, ece, ood_auroc, novel_view_uncertainty_gap, exploration_precision_at_k, planning_safety_gain]
    evidence_level: synthetic
    limitation: The evaluator uses synthetic uncertainty fields and does not train or render a NeRF.

  - contribution_id: C25
    experiment_id: c25_attack_impact
    hypothesis: Attack-specific impact scoring distinguishes geometry, odometry, and sensor degradation and selects proportionate mitigations.
    runner: contributions/25_adversarial_attack_simulator/experiments/eval_attack_impact.py
    smoke_arguments: []
    output_argument: --out
    artifact: c25_attack_impact.csv
    optional_dependencies: []
    baselines: [No-attack scenario]
    primary_metrics: [detected, severity_score, min_distance_degradation, geometry_change, odometry_error_m, mitigation]
    evidence_level: synthetic
    limitation: Injected numerical attacks are not an end-to-end ROS 2 penetration test.

  - contribution_id: C26
    experiment_id: c26_swarm_consensus
    hypothesis: Trust-aware robust consensus maintains agreement and mission success under Byzantine participants better than unweighted aggregation.
    runner: contributions/26_swarm_consensus/experiments/eval_swarm_consensus.py
    smoke_arguments: []
    output_argument: --out
    artifact: c26_swarm_consensus.csv
    optional_dependencies: []
    baselines: [Mean consensus, Median consensus]
    primary_metrics: [consensus_accuracy, mission_success, byzantine_detection_recall, communication_messages, trust_weighted_agreement]
    evidence_level: synthetic
    limitation: In-process simulation does not model real network delays, packet ordering, or ROS 2 DDS failure modes.
