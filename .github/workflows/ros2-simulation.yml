name: ROS 2 Gazebo benchmark

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Measured repetitions per scenario and planner
        required: true
        default: "3"

jobs:
  gazebo-harmonic:
    name: Jazzy / Gazebo Harmonic / minimal TB3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ros:jazzy-ros-base-noble
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install ROS and simulation dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-rosdep
          rosdep init 2>/dev/null || true
          rosdep update
          rosdep install \
            --from-paths \
              ros2_ws/src/dynnav_nav2_cpp \
              ros2_ws/src/dynnav_nav2_benchmark \
            --ignore-src \
            --rosdistro jazzy \
            -r -y

      - name: Build planner and benchmark packages
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon --log-base /tmp/dynnav_gazebo/log build \
            --base-paths \
              ros2_ws/src/dynnav_nav2_cpp \
              ros2_ws/src/dynnav_nav2_benchmark \
            --build-base /tmp/dynnav_gazebo/build \
            --install-base /tmp/dynnav_gazebo/install \
            --packages-select dynnav_nav2_cpp dynnav_nav2_benchmark \
            --event-handlers console_direct+

      - name: Test search, plugin discovery, and experiment contracts
        run: |
          source /opt/ros/jazzy/setup.bash
          source /tmp/dynnav_gazebo/install/setup.bash
          colcon --log-base /tmp/dynnav_gazebo/test-log test \
            --build-base /tmp/dynnav_gazebo/build \
            --install-base /tmp/dynnav_gazebo/install \
            --packages-select dynnav_nav2_cpp dynnav_nav2_benchmark \
            --event-handlers console_direct+
          colcon test-result \
            --test-result-base /tmp/dynnav_gazebo/build \
            --verbose

      - name: Record installed simulation environment
        run: |
          mkdir -p /tmp/dynnav_gazebo/results
          dpkg-query -W -f='${binary:Package}\t${Version}\n' 'ros-jazzy-*' \
            | sort > /tmp/dynnav_gazebo/results/ros_packages.tsv
          uname -a > /tmp/dynnav_gazebo/results/kernel.txt
          gz sim --versions > /tmp/dynnav_gazebo/results/gazebo_versions.txt

      - name: Run paired planner-server benchmark
        run: |
          source /opt/ros/jazzy/setup.bash
          source /tmp/dynnav_gazebo/install/setup.bash
          timeout --signal=INT --kill-after=30s 12m \
            ros2 launch dynnav_nav2_benchmark \
              tb3_static_planner_benchmark.launch.py \
              headless:=true \
              repetitions:=${{ inputs.repetitions }} \
              output_dir:=/tmp/dynnav_gazebo/results
          test -s /tmp/dynnav_gazebo/results/results.json
          test -s /tmp/dynnav_gazebo/results/trials.csv
          test -s /tmp/dynnav_gazebo/results/map_snapshot.yaml
          test -s /tmp/dynnav_gazebo/results/map_image_snapshot.pgm

      - name: Validate result schema
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("/tmp/dynnav_gazebo/results/results.json").read_text()
          )
          assert result["schema_version"] == 1
          assert result["benchmark_type"] == "static_compute_path_to_pose"
          assert len(result["summary"]) == 6
          assert len(result["summary_by_scenario"]) == 2
          expected = int("${{ inputs.repetitions }}") * 2
          assert all(
              item["trials"] == expected for item in result["summary"].values()
          )
          print(json.dumps(result["summary"], indent=2, sort_keys=True))
          PY

      - name: Upload raw benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynnav-jazzy-gazebo-static-planner
          path: /tmp/dynnav_gazebo/results
          if-no-files-found: warn
